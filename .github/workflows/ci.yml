name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Release runs every CI job before packing (.github/workflows/release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # bun fmt and rustfmt, as `bun run fmt:check` runs them locally. "WASM build" also keeps its
  # `cargo fmt --check`, so a required check still fails on unformatted Rust.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install pinned Rust toolchain
        # rustup reads rust-toolchain.toml, so rustfmt matches the local pinned one.
        run: rustup toolchain install && rustfmt --version

      - name: Check formatting
        run: bun run fmt:check

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Keyed on every pin, so a toolchain or dependency bump starts a fresh target dir.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/target
          key: wasm-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/wasm-toolchain.env', 'crates/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Install pinned Rust toolchain
        # rustup reads rust-toolchain.toml (rustc, wasm32 target, clippy, rustfmt).
        run: rustup toolchain install && rustc --version

      - name: Check formatting
        working-directory: crates
        run: cargo fmt --check

      - name: Run clippy
        working-directory: crates
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p text-pdf-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Run Rust tests
        working-directory: crates
        run: cargo test

      # Fails over the gzip budget; prints sha256, raw and gzip sizes.
      - name: Build WASM with pinned tools
        run: sh packages/wasm/build-wasm.sh

      # The glue is committed so TypeScript checks without Rust; the hash proves this build
      # reproduced the contributor's byte for byte.
      - name: Check committed glue and hash match the build
        run: git diff --exit-code -- packages/wasm/src

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: packages/wasm/src/text_pdf_wasm_bg.wasm
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and test package
    # Runs (and fails at the download) even when "WASM build" fails, so this required check cannot pass as skipped.
    needs: wasm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/wasm/src

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: bun ci

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Build packages
        run: bun run build

      - name: Create installable tarballs
        run: |
          mkdir -p artifacts
          # Built by the previous step, so skip each package's prepack build.
          for package in packages/*/; do
            (cd "$package" && bun pm pack --ignore-scripts --destination ../../artifacts)
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  node-compatibility:
    name: Packed package on Node.js ${{ matrix.node }}
    needs: wasm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/wasm/src

      - name: Install locked dependencies
        run: bun ci

      - name: Build and test the packed package
        run: bun run test:package

  visual:
    name: Visual parity
    needs: wasm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Generous for the rare run that must rebuild the image from snapshot.ubuntu.com.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Fork PRs get a read-only token, so they build the image but cannot publish it.
      CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/wasm/src

      - name: Resolve pinned image tag
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/puppeteer-gen-visual:${{ hashFiles('tests/visual/Dockerfile', 'package.json', 'packages/*/package.json', 'bun.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag hashes every input of the image, so it is only rebuilt when they change.
      - name: Pull or build pinned image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          if docker pull "$IMAGE"; then exit 0; fi
          # apt drops stalled snapshot.ubuntu.com connections after 30s and retries 5 times (see the
          # Dockerfile); if a fetch still fails, retry the build once, reusing any finished layers.
          docker build --tag "$IMAGE" --file tests/visual/Dockerfile . \
            || docker build --tag "$IMAGE" --file tests/visual/Dockerfile .
          # Publishing only speeds up later runs; this run already has the image it built.
          if [ "$CAN_PUSH" = true ]; then
            docker push "$IMAGE" || echo "::warning::Could not publish $IMAGE; later runs will rebuild it"
          fi

      - name: Run visual comparison in pinned image
        env:
          VISUAL_IMAGE: ${{ steps.image.outputs.ref }}
        run: sh scripts/test-visual-docker.sh

      - name: Run WASM visual comparison in pinned image
        if: ${{ !cancelled() }}
        env:
          VISUAL_IMAGE: ${{ steps.image.outputs.ref }}
        run: sh scripts/test-visual-docker.sh test:visual:wasm

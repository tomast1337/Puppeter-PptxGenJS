name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: bun ci

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Create installable tarball
        run: |
          mkdir -p artifacts
          bun pm pack --destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  node-compatibility:
    name: Packed package on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: bun ci

      - name: Build and test the packed package
        run: bun run test:package

  visual:
    name: Visual parity
    # Temporarily manual-only: building the pinned image from snapshot.ubuntu.com
    # often exceeds the timeout. Run `bun run test:visual:docker` locally until the
    # image is cached or prebuilt.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run visual comparison in pinned image
        run: sh scripts/test-visual-docker.sh

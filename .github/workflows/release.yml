name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every CI job: typecheck, tests, packed consumers on Node 22/24, Puppeteer and WASM visual
  # parity, and "WASM build" (fmt, clippy, cargo test, glue, hash and size budget).
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  release:
    name: Build GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: bun ci

      - name: Require a matching version tag
        if: github.event_name == 'push'
        run: |
          for manifest in packages/*/package.json; do
            version=$(bun -e "console.log((await Bun.file('$manifest').json()).version)")
            test "v${version}" = "${GITHUB_REF_NAME}" || { echo "$manifest is $version, tag is $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/wasm/src

      # CI built the .wasm on the runner; rebuild it from scratch in the pinned Rust image, at a
      # different path. Both must match the committed hash, so the released binary is reproducible.
      - name: Rebuild WASM in Docker and compare hashes
        run: |
          (cd packages/wasm/src && sha256sum -c text_pdf_wasm_bg.wasm.sha256)
          mv packages/wasm/src/text_pdf_wasm_bg.wasm "$RUNNER_TEMP/ci.wasm"
          rm -rf crates/target
          bun run build:wasm:docker
          cmp "$RUNNER_TEMP/ci.wasm" packages/wasm/src/text_pdf_wasm_bg.wasm
          git diff --exit-code -- packages/wasm/src
          echo "WASM sha256 $(cut -d' ' -f1 packages/wasm/src/text_pdf_wasm_bg.wasm.sha256) reproduced in Docker" >> "$GITHUB_STEP_SUMMARY"

      - name: Build packages
        run: bun run build

      - name: Pack release artifacts
        run: |
          mkdir -p release
          # Built by the previous step, so skip each package's prepack build.
          for package in packages/*/; do
            (cd "$package" && bun pm pack --ignore-scripts --destination ../../release)
          done
          cd release
          sha256sum *.tgz > SHA256SUMS

      - name: Verify the @pdfdeck/wasm tarball ships the built binary
        run: |
          tarball=$(ls release/pdfdeck-wasm-*.tgz)
          tar -xzOf "$tarball" package/dist/text_pdf_wasm_bg.wasm > "$RUNNER_TEMP/packed.wasm"
          expected=$(cut -d' ' -f1 packages/wasm/src/text_pdf_wasm_bg.wasm.sha256)
          actual=$(sha256sum "$RUNNER_TEMP/packed.wasm" | cut -d' ' -f1)
          echo "packed sha256=$actual raw=$(wc -c < "$RUNNER_TEMP/packed.wasm") gzip=$(gzip -9cn "$RUNNER_TEMP/packed.wasm" | wc -c)"
          test "$actual" = "$expected"

      - name: npm publish --dry-run
        run: |
          for tarball in release/*.tgz; do
            # ./ prefix: npm reads a bare "dir/file.tgz" as a GitHub owner/repo shorthand.
            npm publish --dry-run "./$tarball"
          done

      # TODO(publish): nothing is published to npm yet; no token or @pdfdeck org exists. Once they
      # do, add a tag-only step here that runs `npm publish --provenance` for each tarball, gated on
      # the token secret (or npm trusted publishing via the id-token permission above).

      - name: Attest release provenance
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release/*.tgz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

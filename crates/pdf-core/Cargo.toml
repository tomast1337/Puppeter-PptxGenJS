[package]
name = "pdf-core"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Already in the tree through krilla (same version): image data-URI payloads.
base64 = "0.22.1"
# raster-images: needed to draw CBDT bitmap glyphs (Noto Color Emoji) in colour.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
# Already in the tree through krilla's font subsetter (same version): SVG path data and arcs of the model's shape geometry.
kurbo = { version = "0.13.1", default-features = false, features = ["std"] }
parley = { version = "0.13.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

<!DOCTYPE html><html><head><meta name="pdflapas-profile" content="2"><meta name="pdflapas-page-size" content="Screen 16:9 Landscape"><style id="puppeteer-gen-styles">@page {
    size: 10in 5.625in;
    margin: 0;
}

body {
    margin: 0;
    padding: 0;
    font-family: Calibri, Arial, Helvetica, sans-serif;
}

.slide-container {
    width: 960px;
    height: 540px;
    position: relative;
    page-break-after: always;
    background: #FFFFFF;
    overflow: hidden;
    box-sizing: border-box;
}

.slide-container:last-child {
    page-break-after: auto;
}

.slide-element {
    position: absolute;
    box-sizing: border-box;
    /* PowerPoint paints slide objects in insertion order. Give every object a
       stacking context so an earlier object's internal text layer cannot paint
       over a later object's fill. Equal z-index contexts retain DOM order. */
    z-index: 0;
}

.slide-text {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: var(--slide-text-color, #000000);
    font-family: Calibri, Arial, Helvetica, sans-serif;
    font-size: 24px;
    padding: 4.8px 9.6px 4.8px 9.6px;
    /* PptxGenJS writes no clip: PowerPoint and LibreOffice draw text past its box, and a shape's outline and
       line heads past the geometry. */
    overflow: visible;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.slide-text > .shape-svg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.slide-text > .text-content {
    position: relative;
    z-index: 1;
}

/* The line-box strut: a 0px font makes each line exactly the paragraph's line-height tall, its baseline
   in the middle, whatever the fonts' ascent and descent; glyphs with line-height 0 do not size it. The
   Puppeteer print step then moves the paragraph so the baseline lands on data-line-baseline. */
.text-paragraph {
    font-size: 0;
}

.text-run,
.text-bullet {
    line-height: 0;
}

/* The marker is an inline-block, which would indent its own text by the paragraph's hanging text-indent. */
.text-bullet {
    text-indent: 0;
}

.slide-shape {
    border-style: none;
}

/* Standards mode puts an inline <svg> on the text baseline: a zero-height line box would drop it by the strut. */
.slide-shape > .shape-svg {
    display: block;
}

.slide-image {
    display: block;
    color: inherit;
    text-decoration: none;
}

.slide-image-content {
    border: 0;
}

.slide-table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%;
    height: 100%;
    color: #000000;
    font-size: 16px;
}

.slide-table td,
.slide-table th {
    border: none;
    padding: 4.8px 9.6px 4.8px 9.6px;
    vertical-align: top;
}

@media print {
    body {
        margin: 0;
        padding: 0;
    }

    .slide-container {
        page-break-after: always;
        break-after: page;
    }

    .slide-container:last-child {
        page-break-after: auto;
        break-after: auto;
    }

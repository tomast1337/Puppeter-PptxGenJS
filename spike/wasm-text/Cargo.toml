[workspace]
resolver = "2"
members = ["core", "wasm", "node"]

[workspace.dependencies]
text-pdf-core = { path = "core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native addon: favour speed over size.
[profile.release-native]
inherits = "release"
opt-level = 3
